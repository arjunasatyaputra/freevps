name: RDP_TIPSUNIX with State Persistence

on:
  workflow_dispatch:

# Grant write permissions to workflow
permissions:
  contents: write
  actions: write

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0  # Fetch all history to get previous state

      # === RESTORE STATE FROM REPOSITORY ===
      - name: Prepare Tailscale directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "C:\ProgramData\Tailscale" -Force | Out-Null
          Write-Host "Tailscale directory prepared"
      
      - name: Restore Tailscale state from repository
        shell: pwsh
        run: |
          if (Test-Path ".github\state\server-state.conf") {
              Copy-Item ".github\state\server-state.conf" -Destination "C:\ProgramData\Tailscale\server-state.conf"
              Write-Host "Tailscale state restored from repository"
          } else {
              Write-Host "No previous state found (this is normal for first run)"
          }

      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication (if needed)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Remove any existing rule with the same name to avoid duplication
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          
          # For testing, allow any incoming connection on port 3389
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # (Optional) Restart the Remote Desktop service to ensure changes take effect
          Restart-Service -Name TermService -Force

      - name: Create / Update RDP User (Password from Secret)
        shell: pwsh
        run: |
          $username = "SOME_ONE"
          $password = "${{ secrets.RDP_PASSWORD }}"

          if ([string]::IsNullOrWhiteSpace($password)) {
            Write-Error "RDP_PASSWORD secret is not set or empty"
            exit 1
          }

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
              Write-Host "User $username already exists, updating password"
              Set-LocalUser -Name $username -Password $securePass
          } else {
              Write-Host "Creating user $username"
              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member $username
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          }

          echo "RDP_USER=$username" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          # Test connectivity using Test-NetConnection against the Tailscale IP on port 3389
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Setup Environment and Download yt_studio_monitor.zip
        shell: pwsh
        run: |
          pip install playwright
          pip install gdown
      
          Write-Host "Downloading yt_studio_monitor ZIP..."
          New-Item -ItemType Directory -Path "C:\ProjectTemp" -Force | Out-Null
          Set-Location -Path "C:\ProjectTemp"
      
          # Download file
          gdown 13zomwl1J4MAUiXQFYPqOrreZ7Ugs96iE -O yt_studio_monitor.zip
      
          if (!(Test-Path "yt_studio_monitor.zip")) {
              Write-Error "Download failed! yt_studio_monitor.zip not found."
              exit 1
          }
      
          $size = (Get-Item yt_studio_monitor.zip).Length
          Write-Host "Downloaded size: $size bytes"

          # === EXTRACT ZIP ===
          Write-Host "Extracting yt_studio_monitor ZIP..."
          Expand-Archive -Path "yt_studio_monitor.zip" -DestinationPath "C:\ProjectTemp\extracted" -Force

          # === DETECT FOLDER RESULT ===
          $extractedFolder = Get-ChildItem -Path "C:\ProjectTemp\extracted" | Select-Object -First 1

          if ($extractedFolder) {
              Write-Host "Moving project to correct directory..."

              New-Item -ItemType Directory -Path "C:\Users\runneradmin\yt_studio_monitor" -Force | Out-Null

              Copy-Item -Path "$($extractedFolder.FullName)\*" `
                        -Destination "C:\Users\runneradmin\yt_studio_monitor" `
                        -Recurse -Force
          } else {
              Write-Error "Extraction failed or empty!"
              exit 1
          }

          # === VALIDASI FINAL ===
          if (!(Test-Path "C:\Users\runneradmin\yt_studio_monitor\yt_studio_monitor.py")) {
              Write-Warning "yt_studio_monitor.py not found, structure may be incorrect"
          }
          
      - name: Restore yt_studio_monitor sessions from repository
        shell: pwsh
        run: |
          if (Test-Path ".github\sessions\youtube_session.json") {
              New-Item -ItemType Directory -Path "C:\Users\runneradmin\yt_studio_monitor" -Force | Out-Null
              Copy-Item ".github\sessions\youtube_session.json" -Destination "C:\Users\runneradmin\yt_studio_monitor\youtube_session.json" -Force
              Write-Host "yt_studio_monitor session restored from repository"
          } else {
              Write-Host "No previous session found in repository"
          }
          
      - name: Clean Up Existing Processes
        shell: pwsh
        run: |
          Write-Host "Cleaning up any existing Chrome, Python, or Playwright processes..."
          taskkill /F /IM chrome.exe /T /FI "STATUS eq RUNNING" 2>$null | Out-Null
          taskkill /F /IM python.exe /T /FI "STATUS eq RUNNING" 2>$null | Out-Null
          taskkill /F /IM playwright.exe /T /FI "STATUS eq RUNNING" 2>$null | Out-Null
          Write-Host "Cleanup completed."

      - name: Run YouTube Studio Monitor (FOREGROUND)
        shell: pwsh
        working-directory: C:\Users\runneradmin\yt_studio_monitor
        env:
          TG_BOT_TOKEN: "8679441064:AAFzjeMAl4Ml1Y1-rSeGYW3Ca5hsvnFF_QE"
          TG_CHAT_ID: "8675919387"
          PYTHONIOENCODING: "utf-8"
          PYTHONUTF8: "1"
        run: |
          # Force UTF-8 console codepage untuk mencegah UnicodeEncodeError pada emoji
          chcp 65001 | Out-Null
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "http://www.youtube.com/@TipsUNIX"
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: SOME_ONE"
          Write-Host "Password: (stored securely in secret)"
          Write-Host "==================`n"

          Write-Host "Menyediakan akses cepat di Desktop SOME_ONE..."
          if (Test-Path "C:\Users\SOME_ONE\Desktop") {
              $WshShell = New-Object -comObject WScript.Shell
              $Shortcut = $WshShell.CreateShortcut("C:\Users\SOME_ONE\Desktop\Folder_Otomatisasi_yt_studio_monitor.lnk")
              $Shortcut.TargetPath = "C:\Users\runneradmin\yt_studio_monitor"
              $Shortcut.Save()
          }

          # --- Helper: Kirim Telegram dari PowerShell (independen dari Python) ---
          function Send-TelegramFromShell {
              param([string]$Message)
              try {
                  $body = @{ chat_id = $env:TG_CHAT_ID; text = $Message; parse_mode = "HTML" } | ConvertTo-Json -Compress
                  Invoke-RestMethod -Uri "https://api.telegram.org/bot$env:TG_BOT_TOKEN/sendMessage" -Method Post -Body $body -ContentType "application/json; charset=utf-8" -TimeoutSec 15 | Out-Null
                  Write-Host "[LOOP] Telegram notification sent."
              } catch {
                  Write-Host "[LOOP] WARNING: Could not send Telegram notification: $_"
              }
          }

          # --- Helper: Aggressive Cleanup ---
          function Invoke-AggressiveCleanup {
              Write-Host "[LOOP] Aggressive cleanup: killing chrome, chromedriver, node..."
              taskkill /F /IM chrome.exe /T 2>$null | Out-Null
              taskkill /F /IM chromedriver.exe /T 2>$null | Out-Null
              taskkill /F /IM node.exe /T 2>$null | Out-Null
              Start-Sleep -Seconds 5

              # Verify all processes are dead
              $chromeProcs = Get-Process -Name chrome -ErrorAction SilentlyContinue
              $nodeProcs = Get-Process -Name node -ErrorAction SilentlyContinue
              if ($chromeProcs -or $nodeProcs) {
                  Write-Host "[LOOP] WARNING: Zombie processes detected, force killing..."
                  if ($chromeProcs) { $chromeProcs | Stop-Process -Force -ErrorAction SilentlyContinue }
                  if ($nodeProcs) { $nodeProcs | Stop-Process -Force -ErrorAction SilentlyContinue }
                  Start-Sleep -Seconds 5
              }
              Write-Host "[LOOP] Cleanup complete."
          }

          Write-Host "Starting YouTube Studio Monitor in FOREGROUND with Auto-Restart Loop..."
          $env:PYTHONUNBUFFERED = "1"
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          $env:DEBUG = "pw:browser"

          $timeoutMins = 320  # Limit runner loop to 320 mins (runner total is 330)
          $sw = [diagnostics.stopwatch]::StartNew()
          $loopCount = 0
          
          while ($sw.Elapsed.TotalMinutes -lt $timeoutMins) {
              $loopCount++
              $elapsed = [math]::Round($sw.Elapsed.TotalMinutes, 2)
              Write-Host "`n[LOOP #$loopCount] Starting monitor session (Elapsed: $elapsed min)..."
              
              python -u yt_studio_monitor.py
              $exitCode = $LASTEXITCODE
              
              $elapsed = [math]::Round($sw.Elapsed.TotalMinutes, 2)
              Write-Host "[LOOP #$loopCount] Python exited with code: $exitCode (Elapsed: $elapsed min)"
              
              if ($elapsed -ge $timeoutMins) {
                  Write-Host "[LOOP] Time limit reached ($elapsed min). Exiting loop."
                  break
              }
              
              # Aggressive cleanup sebelum restart
              Invoke-AggressiveCleanup
              
              # Kirim notifikasi restart via PowerShell (independen dari Python)
              $statusEmoji = if ($exitCode -eq 0) { "✅" } else { "⚠️" }
              Send-TelegramFromShell "♻️ <b>MONITOR RESTART</b>`n`n$statusEmoji Exit code: $exitCode`n🔄 Loop: #$loopCount`n⏱ Elapsed: $elapsed min`n🌐 IP: $env:TAILSCALE_IP`n`n<i>Memulai ulang dalam 20 detik...</i>"
              
              Write-Host "[LOOP] Waiting 20 seconds before restart..."
              Start-Sleep -Seconds 20
          }
          Write-Host "Reaching Global runner time limit. Preparing to save state..."

      # === SAVE STATE TO REPOSITORY ===
      - name: Save Tailscale state to repository
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "C:\ProgramData\Tailscale\server-state.conf") {
              # Prepare state directory
              New-Item -ItemType Directory -Path ".github\state" -Force | Out-Null
              
              # Copy state file
              Copy-Item "C:\ProgramData\Tailscale\server-state.conf" -Destination ".github\state\server-state.conf" -Force
              
              Write-Host "State file copied to repository"
          } else {
              Write-Host "No state file to save"
          }

      - name: Save yt_studio_monitor sessions to repository
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "C:\Users\runneradmin\yt_studio_monitor\youtube_session.json") {
              New-Item -ItemType Directory -Path ".github\sessions" -Force | Out-Null
              Copy-Item "C:\Users\runneradmin\yt_studio_monitor\youtube_session.json" -Destination ".github\sessions\youtube_session.json" -Force
              Write-Host "yt_studio_monitor session copied to repository"
          } else {
              Write-Host "No session file to save"
          }
      
      - name: Commit and push state
        if: always()
        shell: pwsh
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Pull latest changes first to avoid conflicts
          git pull origin main --no-edit || true
          
          git add .github/state/
          git add .github/sessions/
          
          # Check if there are changes to commit
          $status = git status --porcelain .github/
          if ($status) {
              git commit -m "Save Tailscale state [skip ci]"
              git push
              Write-Host "State committed to repository"
          } else {
              Write-Host "No changes to commit"
          }

      - name: Trigger next workflow run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Write-Host "Triggering next workflow: ${{ github.workflow }} on branch: ${{ github.ref_name }}"
          gh workflow run "${{ github.workflow }}" --ref ${{ github.ref_name }}
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Next workflow triggered successfully"
          } else {
              Write-Host "Failed to trigger next workflow"
          }
